name: Rebuild commit city

on:
  schedule:
    - cron: "23 2 * * *"   # once a day, 02:23 UTC
  push:
    branches: [main]
    paths: ["build/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  city:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools==4.55.3 pillow==11.0.0 numpy==2.1.3
      - name: Build city.svg from the public contribution calendar
        run: python build/build.py --city
      - name: Commit if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/city.svg
          git diff --cached --quiet || git commit -m "Rebuild commit city"
          git push
